<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Närsida</title>
  <meta name="description" content="Kontakta Närsida och berätta om ditt företag. Vi återkommer med ett förslag på en hemsida som passar din verksamhet.">
  <meta name="theme-color" content="#0b0b0d">
  <meta property="og:title" content="Närsida">
  <meta property="og:description" content="Kontakta Närsida och berätta om ditt företag. Vi återkommer med ett förslag på en hemsida som passar din verksamhet.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="sv_SE">
  <link rel="icon" type="image/png" href="/assets/logo-mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;1,500;1,700&family=Fraunces:ital,wght@0,600;0,700;1,600&family=DM+Serif+Display:ital@0;1&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Barlow+Condensed:wght@600;700&family=Archivo:wght@800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/mock.css">
  <script>document.documentElement.classList.add('js')</script>
</head>
<body data-page="kontakt">
  <a class="skip" href="#main">Hoppa till innehållet</a>
  <div class="bg" aria-hidden="true"></div>
  <div id="site-header"></div>
  <main id="main">
    <section class="kw-hero">
      <div class="wrap">
        <p class="eyebrow reveal">Kontakt</p>
        <h1 class="reveal">Hör av dig <em>till oss.</em></h1>
        <p class="lead reveal">Skriv några rader om ditt företag, så återkommer vi med ett förslag.</p>
      </div>
    </section>
    <section class="kw">
      <div class="wrap">
        <p class="kw-chip reveal"><i></i>Personlig kontakt från första samtalet till lansering</p>
        <div class="wz-panel reveal"><div data-contact-form><p class="lead">Formuläret kräver JavaScript. Kontakta oss annars direkt via epost.</p></div></div>
        <p class="kw-direct reveal">Du kan också skriva direkt till <span data-cinfo></span></p>
      </div>
    </section>  </main>
  <div id="site-footer"></div>
  <script src="/js/config.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/previews.js"></script>
  <script src="/js/form.js"></script>
  <script src="/js/app.js"></script>
  <script>(function(){var c=(window.NARSIDA||{}).contact||{},e=document.querySelector('[data-cinfo]');if(e&&c.email)e.innerHTML='<a href="mailto:'+c.email+'">'+c.email+'</a>';})();</script>
</body>
</html>
